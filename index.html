<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kick DocsHub</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800;900&family=Space+Mono:wght@400;700&display=swap">
<style>
  :root{
    --bg:#0A0C0A; --bg2:#070807; --panel:#111511; --panel-2:#0C0F0C;
    --ink:#F4F8F2; --muted:#93A08F; --faint:#5E6B5C;
    --border:#1E251D; --border-2:#2B342A;
    --kick:#53FC18; --kick-dim:#3fbf16; --kick-glow:rgba(83,252,24,.18);
    --sheet:#53FC18; --doc:#2EA6FF; --slides:#FFB020; --file:#8A97A0;
    /* neon team accents on black */
    --t-admin:#53FC18; --t-mod:#2EA6FF; --t-kpp:#B57BFF; --t-sup:#29E5D4;
    --t-tech:#9AA7B0; --t-fraud:#FF4D4D; --t-part:#FFB020; --t-bg:#FF5CAA; --t-ost:#7C8A80;
  }
  *{box-sizing:border-box}
  html{-webkit-text-size-adjust:100%}
  body{
    margin:0; background:var(--bg); color:var(--ink);
    font-family:"Archivo", system-ui, -apple-system, sans-serif;
    font-size:15px; line-height:1.5; -webkit-font-smoothing:antialiased;
    background-image:radial-gradient(1200px 500px at 80% -10%, rgba(83,252,24,.07), transparent 60%);
    background-attachment:fixed;
  }
  a{color:inherit; text-decoration:none}
  .wrap{max-width:1160px; margin:0 auto; padding:0 24px}

  header{
    position:sticky; top:0; z-index:20;
    background:color-mix(in srgb, var(--bg) 82%, transparent);
    backdrop-filter:blur(14px) saturate(1.2); -webkit-backdrop-filter:blur(14px) saturate(1.2);
    border-bottom:1px solid var(--border);
    box-shadow:0 1px 0 rgba(83,252,24,.08);
  }
  .bar{display:flex; align-items:center; gap:16px; padding:15px 0; flex-wrap:wrap}
  .brand{display:flex; align-items:center; gap:11px; margin-right:auto}
  .live{position:relative; width:10px; height:10px; border-radius:50%; background:var(--kick); flex:none;
    box-shadow:0 0 0 0 var(--kick-glow); animation:pulse 2s infinite}
  @keyframes pulse{0%{box-shadow:0 0 0 0 rgba(83,252,24,.5)}70%{box-shadow:0 0 0 9px rgba(83,252,24,0)}100%{box-shadow:0 0 0 0 rgba(83,252,24,0)}}
  .mark{font-family:"Archivo", sans-serif; font-weight:900; font-size:24px; letter-spacing:-.03em; line-height:1; text-transform:uppercase}
  .mark .g{color:var(--kick); text-shadow:0 0 22px var(--kick-glow)}
  .brand .sub{font-family:"Space Mono", monospace; font-size:10.5px; font-weight:700; letter-spacing:.18em; text-transform:uppercase; color:var(--faint)}
  .search{position:relative; flex:1 1 260px; max-width:440px; min-width:200px}
  .search svg{position:absolute; left:13px; top:50%; transform:translateY(-50%); color:var(--faint)}
  .search input{
    width:100%; padding:10px 12px 10px 38px; font:inherit; font-size:14px; font-weight:500; color:var(--ink);
    background:var(--panel); border:1px solid var(--border-2); border-radius:11px; outline:none;
    transition:border-color .15s, box-shadow .15s;
  }
  .search input::placeholder{color:var(--faint)}
  .search input:focus{border-color:var(--kick); box-shadow:0 0 0 3px var(--kick-glow)}
  .totals{font-family:"Space Mono", monospace; font-size:12px; color:var(--muted); white-space:nowrap; display:flex; gap:6px; align-items:center}
  .totals b{color:var(--kick); font-weight:700}

  .filters{display:flex; gap:8px; padding:18px 0 4px; flex-wrap:wrap}
  .chip{
    font-family:"Space Mono", monospace; font-size:12px; font-weight:700; padding:6px 13px;
    border-radius:999px; cursor:pointer; white-space:nowrap; background:var(--panel);
    color:var(--muted); border:1px solid var(--border-2); transition:all .14s; text-transform:uppercase; letter-spacing:.02em;
  }
  .chip:hover{color:var(--ink); border-color:var(--tc, var(--kick)); box-shadow:0 0 14px -4px var(--tc, var(--kick))}
  .chip .n{opacity:.55; margin-left:6px}
  .chip[aria-pressed="true"]{background:var(--tc, var(--kick)); border-color:var(--tc, var(--kick)); color:#07120A; box-shadow:0 0 18px -3px var(--tc, var(--kick))}
  .chip[aria-pressed="true"] .n{opacity:.7}

  main{padding:24px 0 70px}
  .grid{display:grid; grid-template-columns:repeat(auto-fill, minmax(345px,1fr)); gap:18px; align-items:start}
  .team{
    background:linear-gradient(180deg, var(--panel), var(--panel-2));
    border:1px solid var(--border); border-radius:16px; overflow:hidden;
    transition:border-color .18s, box-shadow .18s;
  }
  .team:hover{border-color:color-mix(in srgb, var(--tc) 45%, var(--border-2)); box-shadow:0 0 30px -14px var(--tc)}
  .team-head{
    display:flex; align-items:center; gap:11px; padding:15px 18px;
    border-bottom:1px solid var(--border);
    background:linear-gradient(90deg, color-mix(in srgb, var(--tc) 12%, transparent), transparent 70%);
  }
  .team-head .rail{width:4px; height:22px; border-radius:2px; background:var(--tc); flex:none; box-shadow:0 0 12px -1px var(--tc)}
  .team-head h2{font-family:"Archivo", sans-serif; font-weight:800; font-size:15.5px; letter-spacing:-.01em; margin:0; flex:1; text-wrap:balance; text-transform:uppercase}
  .team-head .count{font-family:"Space Mono", monospace; font-size:12px; font-weight:700; flex:none; color:var(--tc); background:color-mix(in srgb, var(--tc) 15%, transparent); padding:2px 10px; border-radius:999px}
  .docs{list-style:none; margin:0; padding:6px; display:flex; flex-direction:column; gap:2px}
  .row{display:flex; align-items:center; gap:11px; padding:9px 10px; border-radius:10px; transition:background .13s}
  .row:hover{background:rgba(255,255,255,.035)}
  .row .tag{font-family:"Space Mono", monospace; font-size:9px; font-weight:700; letter-spacing:.03em; padding:3px 5px; border-radius:5px; flex:none; width:38px; text-align:center; color:#07120A}
  .tag.sheet{background:var(--sheet)} .tag.doc{background:var(--doc)} .tag.slides{background:var(--slides)} .tag.file{background:var(--file)}
  .row .title{font-size:13.5px; font-weight:500; color:var(--ink); flex:1; min-width:0; line-height:1.35}
  .row .title mark{background:transparent; color:var(--tc); font-weight:700; padding:0}
  .row .go{color:var(--faint); flex:none; opacity:0; transition:opacity .13s, transform .13s; transform:translateX(-2px)}
  .row:hover .go, .row:focus-within .go{opacity:1; transform:none; color:var(--tc)}
  .row a:focus-visible{outline:2px solid var(--tc); outline-offset:2px; border-radius:6px}
  .empty{padding:16px 18px; color:var(--faint); font-size:13px; font-style:italic}
  .team.hidden, .row.hidden{display:none}

  .noresults{display:none; text-align:center; padding:70px 20px; color:var(--muted)}
  .noresults.show{display:block}
  .noresults .big{font-family:"Archivo",sans-serif; font-weight:800; font-size:20px; color:var(--ink); margin-bottom:6px; text-transform:uppercase}

  footer{border-top:1px solid var(--border); padding:22px 0 44px; color:var(--faint); font-size:12px; font-family:"Space Mono", monospace}
  footer b{color:var(--muted); font-weight:700}
  @media (max-width:560px){ .wrap{padding:0 16px} .brand .sub{display:none} .totals{display:none} }
  @media (prefers-reduced-motion:reduce){ *{animation:none!important; transition:none!important} }
</style>

<header>
  <div class="wrap bar">
    <div class="brand">
      <span class="live" aria-hidden="true"></span>
      <span class="mark">Docs<span class="g">Hub</span></span>
      <span class="sub">Kick · timska dokumentacija</span>
    </div>
    <label class="search">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>
      <input id="q" type="search" placeholder="Pretraži dokumente…" autocomplete="off" spellcheck="false" aria-label="Pretraga dokumenata">
    </label>
    <div class="totals"><b id="tDocs">0</b> DOK · <b id="tTeams">0</b> TIMOVA</div>
  </div>
  <div class="wrap"><div class="filters" id="filters"></div></div>
</header>

<main class="wrap">
  <div class="grid" id="grid"></div>
  <div class="noresults" id="noresults">
    <div class="big">Nema rezultata</div>
    <div>Nijedan dokument ne odgovara pretrazi.</div>
  </div>
</main>

<footer class="wrap">
  Izvor: <b>~/DocsHub</b> · prečice se otvaraju u Google Workspace-u · ažurirano <b id="date"></b>
</footer>

<script>
const TEAMS = [
  ["Kick Administracija","admin"], ["Kick Moderacija","mod"], ["Kick KPP moderacija","kpp"],
  ["Kick Support","sup"], ["Kick Tech support","tech"], ["Kick Fraud","fraud"],
  ["Kick Partners","part"], ["Kick Belgrade AM","bg"], ["Ostalo","ost"]
];
const DATA = {
  "Kick Administracija": [
    ["Kick Weekly Metrics","https://docs.google.com/spreadsheets/d/1W9oKG2p0FGl0aeXFaeuTevbglM4jK-IBQcuCA47VXPM/edit"],
    ["Kick Monthly Metrics","https://docs.google.com/spreadsheets/d/1mec_HjUUecOnTNsV0lKnspsN04Cz101ujyAGdeLQHGk/edit"],
    ["Kick - Organizovanje slobodnih dana i odmora","https://docs.google.com/spreadsheets/d/1221V3Vp-mzbAZsQ8XyjZamGJFbGKw98tZtcMKfj27Vk/edit"],
    ["PKP - Kick","https://docs.google.com/spreadsheets/d/1SqMkhh9N389CjuGjn_II4UTsqTco-Q0hGzN1Ah4J2lY/edit"],
    ["KICK pulse check - 24 Aug 2026","https://docs.google.com/presentation/d/10REe9DCXKlaGtYk7Wbtj21zAbIfRLKgu9aYhOxF1bLA/edit"],
    ["KICK pulse check - 17 Aug 2026","https://docs.google.com/presentation/d/1qna9eTFLM7d7CIUKu04879ouRynLYqm4HjFSqoc2WQc/edit"],
    ["KICK pulse check - 10 Aug 2026","https://docs.google.com/presentation/d/1xmFB6T5ETgAOT5PErx3JY6c5UVCJZYGu9NXZZPXyBUY/edit"],
    ["KICK pulse check - 3rd of August","https://docs.google.com/presentation/d/1NMUN688di_5mj057zVvsVMMVdLPhgOiDpZgx1vjcr-k/edit"],
    ["KICK pulse check - 29th of July","https://docs.google.com/presentation/d/1aU8oO9layuF6p_2lKMvHOriA1_ihgP0ERK5rT0Q7zG8/edit"],
    ["Crisis Management Response Process","https://drive.google.com/file/d/1V78EISK0b8eVKWsugoLedVDQ5icnz9yT/view"]
  ],
  "Kick Moderacija": [
    ["KICK Moderacija - Organizovanje","https://docs.google.com/spreadsheets/d/1sIQggN7KuHiUP0BXmk4WhQexZyzsiLWG3pi7JWMC9y8/edit"],
    ["Rejected Appeals","https://docs.google.com/spreadsheets/d/1OMk00w6I5VgeWhiXq2iiUSraSI-C-GIIAkeXnJmQsLM/edit"],
    ["Age Assurance - EU Matrix","https://docs.google.com/spreadsheets/d/14MtEzBnJvAguxxeF-yBxuyFvUx8UnztzanbXRniDD-M/edit"],
    ["Incident Report 05082026 - Fatality shooting","https://docs.google.com/document/d/187IsaAkoBKOXHmWfQ3MXiBpGdWxWcjnJpLXtbx0o8dE/edit"]
  ],
  "Kick KPP moderacija": [
    ["KPP QA sheet","https://docs.google.com/spreadsheets/d/1f0nPWv2jf3VfRL2MdyxhYIPrHVjzcEfP-VaF-kdpxAU/edit"],
    ["stuck_on_running_test_filled_final","https://docs.google.com/spreadsheets/d/1uHktFRqjKdim1fa3C_qgOyVEefDzrQiXJFe_Yo71orU/edit"]
  ],
  "Kick Support": [
    ["Support Shift Report","https://docs.google.com/document/d/1TaWGxvGyImJgBccz52yal-GRgPwLZXEyhFqEpMfx_J4/edit"],
    ["Shift Report","https://docs.google.com/document/d/1Fu-vVoB9CyyDchI8iuuPVB5CB6B87US_stcvoO_WkZA/edit"],
    ["Mesecni izvestaj Support - Nemanja","https://docs.google.com/document/d/1T68Tz_ir5qM1H2fAWmj2K2Su3d8BgD0hdE_ctVUDhlo/edit"],
    ["EU e-Evidence Requests (KODEX) - Intake & Assessment","https://docs.google.com/document/d/1VlvgxblkhOjK-wzK2Y1H30Ct7vj64qL5OyQM_Vb0DWw/edit"]
  ],
  "Kick Tech support": [],
  "Kick Fraud": [
    ["Large earners of KPP Botters/Tabbers & possible Fraud","https://docs.google.com/spreadsheets/d/1MBRJhNp5jg7cvVTQu_C7wLDFl_xFq2JulkHgbTJ30-E/edit"],
    ["KPP Brazillian & Portugese Speaking Tabbers & possible Fraud","https://docs.google.com/spreadsheets/d/173vJLgoXFlsNSjXZutjtMTnZiF3jqzio8MZqIJL47BE/edit"]
  ],
  "Kick Partners": [
    ["Kick Partner - Weekly Tracker","https://docs.google.com/spreadsheets/d/1WMGiWR7ER7NsnGc7xgN7JPCJWE32LiBNNYNnaB1-oYI/edit"],
    ["BD_Lead_EMEA_interview_guide","https://docs.google.com/spreadsheets/d/1VKfOaxykS8NL8pyFfD3_pU9kZXwdwjiHHi-IIV3H2ws/edit"],
    ["Agency Conversation structure","https://docs.google.com/document/d/1zlKgPlicMUmknWq-JDWKOEIr5Kfc_2HfoKLaNy6Z_Fc/edit"]
  ],
  "Kick Belgrade AM": [
    ["Russian Leads - Zambo","https://docs.google.com/spreadsheets/d/16DqmiadD41fnGuSN1h1SvesnSRkomtocX2lRlYM1hAA/edit"],
    ["Russian leads tik tok for Zambo","https://drive.google.com/file/d/1dqDwCC6pzL94s8qHg7m1PVeU2IJMNLkh/view"],
    ["Discord POC - Belgrade office","https://docs.google.com/spreadsheets/d/1m99Yg0SzcwGmgEv1r1clPtd5gR_wl6qwQR-MzPeBd8Y/edit"]
  ],
  "Ostalo": [
    ["MEBIT Pijaca Lista","https://docs.google.com/spreadsheets/d/1n70k0Rb0AEA-d_Y7KrhkzxQ20fUz3KVpRAEUEyZ-Kos/edit"],
    ["Lotos hrana NOVO","https://docs.google.com/spreadsheets/d/1-hyJoDwEm6it8297ZmDVRLm0MSdIBlXlZwo7O56ty2w/edit"]
  ]
};

const typeOf = u =>
  u.includes("/spreadsheets/") ? ["sheet","XLS"] :
  u.includes("/document/")     ? ["doc","DOC"] :
  u.includes("/presentation/") ? ["slides","PPT"] :
  ["file","FILE"];
const esc = s => s.replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

const grid=document.getElementById("grid"), filters=document.getElementById("filters");
const q=document.getElementById("q"), noresults=document.getElementById("noresults");
let active="all";

const totalDocs = TEAMS.reduce((n,[t])=>n+DATA[t].length,0);
document.getElementById("tDocs").textContent = totalDocs;
document.getElementById("tTeams").textContent = TEAMS.filter(([t])=>DATA[t].length).length;

const mkChip=(label,val,slug,count)=>{
  const b=document.createElement("button");
  b.className="chip"; b.dataset.val=val; b.setAttribute("aria-pressed", val==="all");
  if(slug) b.style.setProperty("--tc",`var(--t-${slug})`);
  b.innerHTML=esc(label)+(count!=null?` <span class="n">${count}</span>`:"");
  b.onclick=()=>{active=val;[...filters.children].forEach(c=>c.setAttribute("aria-pressed",c.dataset.val===val));render();};
  return b;
};
filters.appendChild(mkChip("Sve","all",null,totalDocs));
TEAMS.forEach(([t,slug])=>filters.appendChild(mkChip(t.replace(/^Kick /,""),t,slug,DATA[t].length)));

TEAMS.forEach(([team,slug])=>{
  const sec=document.createElement("section");
  sec.className="team"; sec.dataset.team=team;
  sec.style.setProperty("--tc",`var(--t-${slug})`);
  const docs=DATA[team];
  let rows=docs.map(([title,url])=>{
    const [cls,tag]=typeOf(url);
    return `<li class="row" data-title="${esc(title.toLowerCase())}">
      <a href="${esc(url)}" target="_blank" rel="noopener" style="display:contents">
        <span class="tag ${cls}">${tag}</span>
        <span class="title">${esc(title)}</span>
        <span class="go"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M7 17 17 7M9 7h8v8"/></svg></span>
      </a></li>`;
  }).join("");
  if(!docs.length) rows=`<div class="empty">Još nema dokumenata — dodaj prvi.</div>`;
  sec.innerHTML=`<div class="team-head"><span class="rail"></span><h2>${esc(team)}</h2><span class="count">${docs.length}</span></div><ul class="docs">${rows}</ul>`;
  grid.appendChild(sec);
});

function render(){
  const term=q.value.trim().toLowerCase();
  let visibleDocs=0;
  document.querySelectorAll(".team").forEach(sec=>{
    const team=sec.dataset.team, teamOk=active==="all"||active===team;
    let shown=0;
    sec.querySelectorAll(".row").forEach(li=>{
      const t=li.dataset.title, match=teamOk&&(!term||t.includes(term));
      li.classList.toggle("hidden",!match);
      if(match){shown++; visibleDocs++;
        const el=li.querySelector(".title"), raw=el.textContent;
        if(term){const i=raw.toLowerCase().indexOf(term);
          el.innerHTML=i<0?esc(raw):esc(raw.slice(0,i))+"<mark>"+esc(raw.slice(i,i+term.length))+"</mark>"+esc(raw.slice(i+term.length));
        } else el.textContent=raw;
      }
    });
    const isEmptyTeam=!!sec.querySelector(".empty");
    const showEmpty=isEmptyTeam&&!term&&(active==="all"||active===team);
    sec.classList.toggle("hidden", !(shown>0||showEmpty));
  });
  noresults.classList.toggle("show", visibleDocs===0 && !document.querySelector(".team:not(.hidden)"));
}
q.addEventListener("input",render);
document.getElementById("date").textContent=new Date().toLocaleDateString("sr-RS");
render();
</script>
